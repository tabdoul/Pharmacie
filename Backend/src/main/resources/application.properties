spring.application.name=pharmacie-guinee
# --- Base de donnees PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/Pharmacie
spring.datasource.username=postgres
spring.datasource.password=&Mariamediak5
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Jeu de donnees de test (data.sql) ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Serveur ---
server.port=8080

# --- JWT ---
app.jwt.secret=${JWT_SECRET:changeCetteCleEnProductionAvecUneValeurLongueEtAleatoire123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (a restreindre au domaine du frontend Angular en production) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Stockage des documents d'agrement (upload a l'inscription) ---
app.storage.documents-agrement-dir=${STORAGE_DOCUMENTS_DIR:uploads/documents-agrement}
app.storage.max-taille-mo=5

# --- Taille max des requetes multipart (doit couvrir app.storage.max-taille-mo) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Cle temporaire pour proteger les endpoints d'administration ---
app.admin.key=${ADMIN_KEY:changeCetteCleAdminEnProduction}